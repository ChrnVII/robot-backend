schema_version: 1
robot:
  robot_id: robot-production-001
  timezone: Asia/Shanghai
runtime:
  mode: hardware
  log_level: INFO
  queue_size: 128
devices:
  camera:
    transport: rtsp
    camera_id: VAR-1
    host: 192.168.137.64
    port: 554
    path: /Streaming/Channels/101
    detection_path: /Streaming/Channels/102
    width: 1280
    height: 720
    timeout_seconds: 5
    username: ${CAMERA_USERNAME:-admin}
    password: ${CAMERA_PASSWORD}
    auth_scheme: digest
    stream: 101
    jpeg_quality: 90
    control:
      protocol: hikvision_isapi
      auth_scheme: digest
      base_url: http://192.168.137.64
      channel: 1
      snapshot_path: /ISAPI/Streaming/channels/101/picture
      ptz_path: /ISAPI/PTZCtrl/channels/1/continuous
      preset_path: /ISAPI/PTZCtrl/channels/1/presets/{preset}
      goto_preset_path: /ISAPI/PTZCtrl/channels/1/presets/{preset}/goto
      reboot_path: /ISAPI/System/reboot
      stop_path: /ISAPI/PTZCtrl/channels/1/continuous
      state_path: /ISAPI/System/deviceInfo
      method: PUT
      request_format: xml
      timeout_seconds: 5
  cameras:
    items:
      - id: cam01
        enabled: true
        transport: rtsp
        host: 192.168.136.11
        port: 554
        path: /avstream/channel=1/stream=0.sdp
        detection_path: /avstream/channel=1/stream=1.sdp
        username: ${INSPECTION_CAMERA_USERNAME:-admin}
        password: ${INSPECTION_CAMERA_PASSWORD:-admin123}
        width: 1280
        height: 720
        timeout_seconds: 5
      - id: cam02
        enabled: true
        transport: rtsp
        host: 192.168.136.12
        port: 554
        path: /avstream/channel=1/stream=0.sdp
        detection_path: /avstream/channel=1/stream=1.sdp
        username: ${INSPECTION_CAMERA_USERNAME:-admin}
        password: ${INSPECTION_CAMERA_PASSWORD:-admin123}
      - id: cam03
        enabled: true
        transport: rtsp
        host: 192.168.136.13
        port: 554
        path: /avstream/channel=1/stream=0.sdp
        detection_path: /avstream/channel=1/stream=1.sdp
        username: ${INSPECTION_CAMERA_USERNAME:-admin}
        password: ${INSPECTION_CAMERA_PASSWORD:-admin123}
      - id: cam04
        enabled: true
        transport: rtsp
        host: 192.168.136.14
        port: 554
        path: /avstream/channel=1/stream=0.sdp
        detection_path: /avstream/channel=1/stream=1.sdp
        username: ${INSPECTION_CAMERA_USERNAME:-admin}
        password: ${INSPECTION_CAMERA_PASSWORD:-admin123}
      - id: cam05
        enabled: true
        transport: rtsp
        host: 192.168.136.21
        port: 554
        path: /avstream/channel=1/stream=0.sdp
        detection_path: /avstream/channel=1/stream=1.sdp
        username: ${INSPECTION_CAMERA_USERNAME:-admin}
        password: ${INSPECTION_CAMERA_PASSWORD:-admin123}
      - id: cam06
        enabled: true
        transport: rtsp
        host: 192.168.136.22
        port: 554
        path: /avstream/channel=1/stream=0.sdp
        detection_path: /avstream/channel=1/stream=1.sdp
        username: ${INSPECTION_CAMERA_USERNAME:-admin}
        password: ${INSPECTION_CAMERA_PASSWORD:-admin123}
      - id: cam07
        enabled: true
        transport: rtsp
        host: 192.168.136.23
        port: 554
        path: /avstream/channel=1/stream=0.sdp
        detection_path: /avstream/channel=1/stream=1.sdp
        username: ${INSPECTION_CAMERA_USERNAME:-admin}
        password: ${INSPECTION_CAMERA_PASSWORD:-admin123}
      - id: cam08
        enabled: true
        transport: rtsp
        host: 192.168.136.24
        port: 554
        path: /avstream/channel=1/stream=0.sdp
        detection_path: /avstream/channel=1/stream=1.sdp
        username: ${INSPECTION_CAMERA_USERNAME:-admin}
        password: ${INSPECTION_CAMERA_PASSWORD:-admin123}
  audio:
    # 已按真机实测冻结（docs/AUDIO_CAPTURE_UPLOAD_PLAN.md §0.5）：
    # ATR USB 麦(card1) / 44.1kHz / 单声道 / 10s；增益 numid=8 固定 18（+16dB）。
    # device 按名字子串匹配 PortAudio 输入设备，避免索引随 USB 枚举漂移。
    device: "USB Audio"
    sample_rate: 44100
    channels: 1
    duration_seconds: 10.0
    silence_rms_dbfs: -70.0
    clip_ratio_threshold: 0.001
    timeout_margin_seconds: 5.0
    max_retries: 1
  environment:
    # 采集通道：serial = 新后端经 485 直读（不依赖旧 Java 服务）
    #           http   = 旧链路（POST /sensorData/detectLtwy），仅在旧服务在线时可用，作回滚通道
    transport: serial
    port: /dev/ttyS0
    baudrate: 9600
    bytesize: 8
    parity: N
    stopbits: 1
    timeout_seconds: 0.5
    # 485 半双工：帧间必须留空，否则从站还没释放总线就发下一帧会丢包
    frame_gap_ms: 50
    max_retries: 1
    poll_interval_seconds: 5
    # 寄存器表：2026-10-23 真机抓帧确认（9600-8N1 / Modbus-RTU / FC03），
    # 三帧请求与响应的 CRC 均已逐帧校验；缩放系数用旧面板读数反推验证。
    sensors:
      - slave: 12
        label: 温湿度
        register: 0x0000
        count: 2
        fields:
          - { offset: 0, name: temperature_c,    scale: 0.1, unit: "℃" }
          - { offset: 1, name: humidity_percent, scale: 0.1, unit: "%RH" }
      - slave: 2
        label: 光照
        register: 0x0000
        count: 1
        fields:
          - { offset: 0, name: illuminance_lux, scale: 1, unit: lux }
      - slave: 3
        label: 风速
        register: 0x0063
        count: 1
        fields:
          - { offset: 0, name: wind_speed_mps, scale: 0.1, unit: "m/s" }
    # —— 回滚：把 transport 改成 http 并重启 robot-core，即恢复旧链路 ——
    # base_url: http://127.0.0.1:9010
    # port_name: /dev/ttyS0
inspection:
  mode: single
  # Fallback per-camera inference ceiling; profiles override it by camera count.
  capture_fps: 2
  # Detection-rate tiers keep total inference calls per second roughly constant.
  # Recording and preview always run at the source frame rate.
  profiles:
    - max_cameras: 1
      capture_fps: 5
    - max_cameras: 4
      capture_fps: 2
    - max_cameras: 8
      capture_fps: 1
  # Frames from multiple cameras per model call (1 disables batching).
  inference_batch_size: 4
  decode_threads: 1
  max_frame_age_seconds: 1
  stream_stall_timeout_seconds: 15
  camera_startup_timeout_seconds: 30
  # Grace before failing when every camera is down (0 = fail immediately).
  # A single camera failing only disables that camera; the task keeps running.
  camera_all_failed_grace_seconds: 60
storage:
  backend: postgresql
  database_url: postgresql+psycopg://robot:${ROBOT_DB_PASSWORD}@127.0.0.1:5432/robot_platform
  database: postgresql+psycopg://robot:${ROBOT_DB_PASSWORD}@127.0.0.1:5432/robot_platform
  pool:
    min_size: 1
    max_size: 8
    timeout_seconds: 10
  media_root: ../data/media
  telemetry_root: ../data/telemetry
ipc:
  robot_core: ../run/robot-core.sock
  sensor_worker: ../run/sensor-worker.sock
  inference_worker: ../run/inference-worker.sock
  inspection_worker: ../run/inspection-worker.sock
  sync_agent: ../run/sync-agent.sock
api:
  host: 0.0.0.0
  port: 8100
safety:
  # 客户端未带时间戳时的兜底有效期；API 侧统一用 ROBOT_COMMAND_TTL_MS（默认 5000）。
  default_command_ttl_ms: 3000
  lease_ttl_ms: 3000
  max_motion_distance_m: 2.0
  minimum_battery_percent: 15.0
sync:
  enabled: false
  transport: https
  endpoint: https://cloud.example.invalid/api/v1/robots/events
  connect_timeout_seconds: 10
  certificate_file: null
  private_key_file: null
  ca_file: null
  batch_size: 50
  retry_base_seconds: 2.0
  max_attempts: 10
  poll_interval_seconds: 2.0
models:
  package_root: ../model_library/packages
  allow_test_adapter: false
  heat_stress:
    enabled: true
    path: ../models/hs_detect/weights/best.pt
    sha256: DCA2001ACD89EDB5AA52AEF89D09DA83AD941CEEC79CEF7942FB999371120D49
    # Defaults to CPU so the same config works on robots without NVIDIA runtime.
    device: ${MODEL_DEVICE:-cpu}
    cpu_threads: 4
    imgsz: 640
    conf: 0.25
    iou: 0.7
legacy_compat:
  enabled: true
  config: ../config.json

