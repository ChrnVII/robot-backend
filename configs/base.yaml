schema_version: 1
robot:
  robot_id: robot-dev-001
  timezone: Asia/Shanghai
runtime:
  mode: simulated
  log_level: INFO
  queue_size: 128
devices:
  camera:
    transport: v4l2
    device: "0"
    width: 1280
    height: 720
    warmup_frames: 3
    jpeg_quality: 90
    control:
      # Set these paths to the actual vendor API before hardware deployment.
      base_url: http://127.0.0.1:8080
      snapshot_path: /API/picture
      ptz_path: null
      preset_path: null
      goto_preset_path: null
      reboot_path: null
      stop_path: null
      state_path: null
      method: POST
      request_format: json
      timeout_seconds: 5
  audio:
    # 已按真机实测冻结（docs/AUDIO_CAPTURE_UPLOAD_PLAN.md §0.5）：
    # ATR USB 麦(card1) / 44.1kHz / 单声道 / 10s；增益 numid=8 固定 18（+16dB）。
    # device 按名字子串匹配 PortAudio 输入设备，避免索引随 USB 枚举漂移。
    device: "USB Audio"
    sample_rate: 44100
    channels: 1
    duration_seconds: 10.0
    silence_rms_dbfs: -70.0
    clip_ratio_threshold: 0.001
    timeout_margin_seconds: 5.0
    max_retries: 1
  environment:
    # simulated 模式下 environment 由 SimulatedDeviceDriver 提供，此段不生效；
    # 真实串口/HTTP 采集只在 runtime.mode=hardware 时启用（见 hardware.yaml）。
    transport: http
    base_url: http://127.0.0.1:9010
    port_name: /dev/ttyS0
    poll_interval_seconds: 5
    timeout_seconds: 2
inspection:
  mode: single
  # Per-camera inference ceiling; preview and original recording keep source FPS.
  capture_fps: 2
  decode_threads: 1
  max_frame_age_seconds: 1
  stream_stall_timeout_seconds: 15
  camera_startup_timeout_seconds: 30
storage:
  backend: postgresql
  # Local PostgreSQL; deployments provide ROBOT_DB_PASSWORD through the
  # environment or systemd credentials.
  database_url: postgresql+psycopg://robot:${ROBOT_DB_PASSWORD:-robot}@127.0.0.1:5432/robot_platform
  database: postgresql+psycopg://robot:${ROBOT_DB_PASSWORD:-robot}@127.0.0.1:5432/robot_platform
  pool:
    min_size: 1
    max_size: 8
    timeout_seconds: 10
  media_root: ../data/media
  telemetry_root: ../data/telemetry
ipc:
  robot_core: ../run/robot-core.sock
  sensor_worker: ../run/sensor-worker.sock
  inference_worker: ../run/inference-worker.sock
  inspection_worker: ../run/inspection-worker.sock
  sync_agent: ../run/sync-agent.sock
api:
  host: 127.0.0.1
  port: 8100
safety:
  # 客户端未带时间戳时的兜底有效期；API 侧统一用 ROBOT_COMMAND_TTL_MS（默认 5000）。
  default_command_ttl_ms: 3000
  lease_ttl_ms: 3000
  max_motion_distance_m: 2.0
  minimum_battery_percent: 15.0
sync:
  enabled: false
  transport: https
  endpoint: https://cloud.example.invalid/api/v1/robots/events
  connect_timeout_seconds: 10
  certificate_file: null
  private_key_file: null
  ca_file: null
  batch_size: 50
  retry_base_seconds: 2.0
  max_attempts: 10
  poll_interval_seconds: 2.0
models:
  package_root: ../model_library/packages
  allow_test_adapter: true
  heat_stress:
    enabled: false
    path: ../models/hs_detect/weights/best.pt
    device: cpu
    cpu_threads: 4
    imgsz: 640
    conf: 0.25
    iou: 0.7
legacy_compat:
  enabled: true
  config: ../config.json

