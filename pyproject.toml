[project]
name = "backend"
version = "0.2.0"
description = "巡检机器人业务后端（FastAPI）+ 机器人运行时（robot_core 五进程）"
requires-python = ">=3.12"
dependencies = [
    "fastapi[standard]>=0.141.1",
    "sqlalchemy>=2.0,<3",
    "pyjwt>=2.8,<3",
    "pyyaml>=6,<7",
    "networkx>=3.2,<4",
    "psycopg[binary]>=3.2,<4",
    "psycopg-pool>=3.2,<4",
]

[dependency-groups]
dev = ["pytest>=8,<9"]
# 硬件设备能力（串口等），robot-core 使用
hardware = ["pyserial>=3.5,<4", "pyserial-asyncio>=0.6,<1"]
# 媒体采集能力（相机 / 音频），sensor-worker 使用
media = ["opencv-python-headless>=4.9,<5", "sounddevice>=0.4,<1"]
# 模型推理能力（torch / ultralytics），inference-worker 使用
inference = ["torch>=2.2,<3", "ultralytics>=8.3,<9"]

[tool.uv]
# 默认全量安装：一条 `uv sync` 装齐全部；精简场景用 --no-group 排除对应组
default-groups = ["dev", "hardware", "media", "inference"]

[tool.pytest.ini_options]
pythonpath = ["."]
testpaths = ["tests"]
addopts = "-q"

[tool.fastapi]
entrypoint = "app.main:app"
